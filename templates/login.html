<!doctype html>
<html lang="zh-CN" data-theme="linear">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>登录 - SubConvert Manager</title>
  <script>(function(){var t="linear";try{t=localStorage.getItem("scm_theme")||t;}catch(e){}if(!/^(linear|vercel|supabase|stripe|notion|raycast|mintlify|warp|sentry|claude)$/.test(t))t="linear";document.documentElement.setAttribute("data-theme",t);}());</script>
  <link rel="icon" type="image/svg+xml" href="{{ url_prefix }}/static/favicon.svg?v=ui-20261108b"/>
  <link rel="stylesheet" href="{{ url_prefix }}/static/style.css?v=ui-20261108b"/>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-head">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="m12 3 8 4.5-8 4.5-8-4.5L12 3Z"/><path d="m4 12 8 4.5 8-4.5"/><path d="m4 16.5 8 4.5 8-4.5"/></svg>
        </span>
        <h1>管理员登录</h1>
        <div class="sub">请输入管理员账号密码后进入控制台。</div>
      </div>

      {% if error %}
      <div class="notice error" role="alert">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 2.4 20.4h19.2L12 3.2Z"/><path d="M12 9.4v4.6"/><circle cx="12" cy="17.2" r=".8"/></svg>
        <div class="notice-body">
          <div class="notice-title">登录失败</div>
          <div>{{ error }}</div>
        </div>
      </div>
      {% endif %}

      <form class="auth-form" method="post" action="{{ url_prefix }}/login" data-lock-submit>
        <div class="field">
          <label for="login-user">账号</label>
          <input id="login-user" name="username" autocomplete="username" required aria-label="账号"/>
        </div>

        <div class="field">
          <label for="login-pass">密码</label>
          <input id="login-pass" type="password" name="password" autocomplete="current-password" required aria-label="密码"/>
        </div>

        <div class="actions">
          <button class="btn primary" type="submit">登录</button>
          <a class="btn" href="{{ url_prefix }}/">返回首页</a>
        </div>
      </form>

      <div class="auth-foot">
        建议在 <span class="mono">config.env</span> 设置强密码，并配置 <span class="mono">SESSION_SECRET</span> 与 <span class="mono">SUB_TOKEN</span>。
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <div class="title">提示</div>
    <div class="msg"></div>
  </div>

  <script src="{{ url_prefix }}/static/app.js?v=ui-20261108b"></script>
</body>
</html>
